<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="apple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Inner subtle ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Shield / Bowl / Nutrition icon elements -->
  <g filter="url(#shadow)" transform="translate(256, 266)">
    <!-- Stylized Bowl of Healthy Nutrition -->
    <path d="M -130,-20 C -130,90 130,90 130,-20 Z" fill="#ffffff" />
    
    <!-- Food steam / energy lines -->
    <path d="M -150,-24 L 150,-24 C 154,-24 158,-28 158,-32 C 158,-36 154,-40 150,-40 L -150,-40 C -154,-40 -158,-36 -158,-32 C -158,-28 -154,-24 -150,-24 Z" fill="#ecfdf5" />

    <!-- Healthy Apple / Vitality core -->
    <path d="M 0,-40 C -45,-90 -90,-40 -90,10 C -90,70 -30,90 0,90 C 30,90 90,70 90,10 C 90,-40 45,-90 0,-40 Z" fill="url(#leaf-grad)" opacity="0.95" />

    <!-- Fork & Leaf Accents -->
    <!-- Heart pulse / Vitality curve in center -->
    <path d="M -60,10 L -30,10 L -10,-25 L 10,35 L 30,-5 L 45,10 L 60,10" fill="none" stroke="#059669" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Golden Sprout Leaf -->
    <path d="M 0,-40 C 0,-110 50,-130 90,-110 C 90,-70 50,-40 0,-40 Z" fill="url(#apple-grad)" />
    <path d="M 0,-40 C 0,-90 -40,-110 -70,-95 C -70,-65 -35,-40 0,-40 Z" fill="#a7f3d0" />
  </g>

  <!-- Small star spark -->
  <circle cx="390" cy="120" r="14" fill="#fde047" opacity="0.9" />
  <circle cx="120" cy="390" r="10" fill="#ffffff" opacity="0.6" />
</svg>
